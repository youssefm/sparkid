name: Release

on:
  # Note: workflow_dispatch ignores `branches:` filters — the main-only guard
  # lives in the ci-check job below.
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - retry

# Least privilege: nothing at workflow level; each job declares only what it
# uses. Anything that executes dependency code (npm install scripts, tsup,
# build.rs, maturin builds) runs in a job without id-token, because the
# registries' trusted publishers aren't environment-bound: any job holding
# id-token could mint a token PyPI, crates.io, and npm all accept. Publish
# jobs only upload prebuilt artifacts. Actions are SHA-pinned for the same reason.
permissions: {}

jobs:
  # Gate: verify CI has already passed for the commit being released (wait up to 5 min if in progress)
  ci-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # query Test workflow runs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify CI passed for the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          # Fail (not skip) so create-release's `!failure()` condition also stops it
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

          if [ "$MODE" = "retry" ]; then
            # Retry publishes the existing tag, not HEAD. The tag is either prepare's
            # bump commit, which has no Test run (GITHUB_TOKEN pushes don't trigger
            # workflows) and differs from its CI-gated parent only in version strings,
            # or a commit the tag was moved to by hand to ship a fix (as with v2.1.0).
            current=$(grep '"version"' js/package.json | head -1 | sed 's/.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/')
            if ! sha=$(git rev-parse --verify --quiet "refs/tags/v$current^{commit}"); then
              echo "::error::Retry failed — tag v$current does not exist"
              exit 1
            fi
            if [ "$(git log -1 --format=%s "$sha")" = "chore: bump version to $current" ]; then
              sha=$(git rev-parse "$sha^")
            fi
          else
            sha=$(git rev-parse HEAD)
          fi
          echo "Checking Test workflow status for $sha ..."

          for i in $(seq 1 30); do
            # Query only the Test workflow's runs for this commit
            run_status=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0] // empty | {status, conclusion}')

            if [ -z "$run_status" ]; then
              if [ "$i" -eq 30 ]; then
                echo "::error::No Test workflow run found for $sha after 5 minutes"
                exit 1
              fi
              echo "  Attempt $i/30: no run found yet, waiting 10s ..."
              sleep 10
              continue
            fi

            status=$(echo "$run_status" | jq -r '.status')
            conclusion=$(echo "$run_status" | jq -r '.conclusion')
            echo "  Attempt $i/30: status=$status conclusion=$conclusion"

            if [ "$status" != "completed" ]; then
              if [ "$i" -eq 30 ]; then
                echo "::error::Test workflow still running after 5 minutes — aborting"
                exit 1
              fi
              echo "  Still running, waiting 10s ..."
              sleep 10
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              echo "✅ Test workflow passed"
              exit 0
            else
              echo "::error::Test workflow finished with conclusion: $conclusion"
              exit 1
            fi
          done

  # ── Prepare: calculate version, stamp manifests, build, commit + tag ──
  prepare:
    needs: ci-check
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push version-bump commit + tag
    outputs:
      new_version: ${{ steps.version.outputs.new }}
    steps:
      # Credentials intentionally persisted: the stamp step `git push`es with them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # ── Calculate new version ──────────────────────────────────
      - name: Calculate version
        id: version
        env:
          MODE: ${{ inputs.mode }}
        run: |
          current=$(grep '"version"' js/package.json | head -1 | sed 's/.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/')

          if [ "$MODE" = "retry" ]; then
            # Retry: use current version from package.json (already bumped)
            if ! git ls-remote --tags origin "refs/tags/v$current" | grep -q "v$current"; then
              echo "::error::Retry failed — tag v$current does not exist"
              exit 1
            fi
            echo "🔄 Retrying release of v$current"
            echo "new=$current" >> "$GITHUB_OUTPUT"
            echo "needs_stamp=false" >> "$GITHUB_OUTPUT"
            echo "### 🔄 Retry: publishing v$current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Normal path: bump version
          IFS='.' read -r major minor patch <<< "$current"

          case "$MODE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="${major}.${minor}.${patch}"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "needs_stamp=true" >> "$GITHUB_OUTPUT"
          echo "### Version bump: $current → $new ($MODE)" >> "$GITHUB_STEP_SUMMARY"

      # ── Stamp, build, commit, tag, push ────────────────────────
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.version.outputs.needs_stamp == 'true'
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        if: steps.version.outputs.needs_stamp == 'true'
        with:
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.version.outputs.needs_stamp == 'true'
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.version.outputs.needs_stamp == 'true'
        with:
          toolchain: stable

      - name: Stamp, build, commit, tag, push
        if: steps.version.outputs.needs_stamp == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          # Stamp version into all package manifests
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" js/package.json
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" python/pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" python/Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"$NEW_VERSION\"/" rust/Cargo.toml

          # Update lock files. Subshells, not `cd x && ... && cd ..`, because
          # bash -e ignores a failure in the middle of an && chain.
          (cd js && npm install --package-lock-only)
          (cd python && uv lock)
          # Bump only our own crates' versions; keep every other dependency pinned
          # (generate-lockfile would re-resolve all deps to untested versions)
          (cd python && cargo update --workspace)
          (cd rust && cargo update --workspace)

          # Commit, tag, push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"
          echo "### ✅ Committed and tagged v$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ── Build npm tarball (no OIDC: runs dependency install scripts + tsup) ──
  build-npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Build and pack
        run: |
          cd js
          npm ci
          npm run build
          npm pack

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-tarball
          path: js/sparkid-*.tgz
          if-no-files-found: error

  # ── Publish to npm (runs no package code; only the npm CLI touches OIDC) ──
  publish-npm:
    needs: [prepare, build-npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm trusted publishing
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if version already published to npm
        id: check
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          if npm view "sparkid@$NEW_VERSION" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ sparkid@$NEW_VERSION already exists on npm — skipping publish"
            echo "### ⏭️ npm: already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "📦 sparkid@$NEW_VERSION not found on npm — will publish"
          fi

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: steps.check.outputs.already_published == 'false'
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          npm publish npm-tarball/*.tgz --access public --ignore-scripts
          echo "### ✅ Published sparkid@$NEW_VERSION to npm" >> "$GITHUB_STEP_SUMMARY"

  # ── Build Python wheels (parallel, multi-platform) ──────────────

  # Linux glibc (manylinux)
  build-python-linux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64, i686, aarch64, armv7, ppc64le]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          manylinux: auto
          working-directory: python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist
          if-no-files-found: error

  # Linux musl (Alpine, distroless)
  build-python-musllinux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t
          manylinux: musllinux_1_2
          working-directory: python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: python/dist
          if-no-files-found: error

  # macOS
  build-python-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build wheels — x86_64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist -i 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          working-directory: python
      - name: Build wheels — universal2
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          working-directory: python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-macos
          path: python/dist
          if-no-files-found: error

  # Windows
  build-python-windows:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x64
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11"
          - os: windows-latest
            target: x86
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t"
          - os: windows-11-arm
            target: aarch64
            interpreter: "3.11 3.12 3.13 3.14 3.14t"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.interpreter }}
          working-directory: python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-windows-${{ matrix.target }}
          path: python/dist
          if-no-files-found: error

  # Source distribution
  build-python-sdist:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-sdist
          path: python/dist
          if-no-files-found: error

  # ── Publish to PyPI (after wheels are built) ───────────────────
  # Wheels are always built, even on retry: PyPI uploads are per-file, so the
  # version can exist with only some files (a failed `uv publish`).
  publish-pypi:
    needs: [prepare, build-python-linux, build-python-musllinux, build-python-macos, build-python-windows, build-python-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Skip by filename, not by content hash (`uv publish --check-url`):
      # rebuilt wheels are not byte-reproducible across runs (toolchain and
      # image drift), and PyPI rejects a same-named file with different content.
      # A file already on PyPI was built from this same tag, so leave PyPI's copy.
      # The JSON API is CDN-cached (~15 min): if a just-uploaded file is missing
      # from it, `uv publish` fails with "File already exists" — rerun retry.
      - name: Drop files already on PyPI
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          # download-artifact succeeds on zero matches; without this, a run with
          # no artifacts would look like "everything already published".
          if ! compgen -G 'dist/*' > /dev/null; then
            echo "::error::No distributions downloaded"
            exit 1
          fi
          http_code=$(curl -s -o pypi.json -w '%{http_code}' "https://pypi.org/pypi/sparkid/$NEW_VERSION/json")
          case "$http_code" in
            200) jq -r '.urls[].filename' pypi.json > existing.txt ;;
            404) : > existing.txt ;;
            *) echo "::error::PyPI lookup failed (HTTP $http_code)"; exit 1 ;;
          esac
          while read -r filename; do
            if [ -f "dist/$filename" ]; then
              echo "⏭️ $filename already on PyPI"
              rm "dist/$filename"
            fi
          done < existing.txt

      - name: Publish to PyPI
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          if ! compgen -G 'dist/*' > /dev/null; then
            echo "### ⏭️ PyPI: all files already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv publish dist/*
          echo "### ✅ Published sparkid $NEW_VERSION to PyPI" >> "$GITHUB_STEP_SUMMARY"

  # ── Verify crate builds (no OIDC: compiling runs dependency build.rs scripts) ──
  verify-crates:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Package and verify-build the crate
        run: |
          cd rust
          cargo package

  # ── Publish to crates.io (--no-verify: the build check ran in verify-crates) ──
  publish-crates:
    needs: [prepare, verify-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # crates.io trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: v${{ needs.prepare.outputs.new_version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check if version already published to crates.io
        id: check
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          http_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: sparkid-release-ci (github.com/youssefm/sparkid)' "https://crates.io/api/v1/crates/sparkid/$NEW_VERSION")
          if [ "$http_code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ sparkid $NEW_VERSION already exists on crates.io — skipping publish"
            echo "### ⏭️ crates.io: already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "📦 sparkid $NEW_VERSION not found on crates.io (HTTP $http_code) — will publish"
          fi

      - name: Authenticate with crates.io
        if: steps.check.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: crates-auth

      - name: Publish to crates.io
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          cd rust
          cargo publish --no-verify
          echo "### ✅ Published sparkid $NEW_VERSION to crates.io" >> "$GITHUB_STEP_SUMMARY"

  # ── Create GitHub Release (after all publishes succeed) ────────
  create-release:
    needs: [publish-npm, publish-pypi, publish-crates, prepare]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if release already exists
        id: check
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$NEW_VERSION" &>/dev/null; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Release v$NEW_VERSION already exists — skipping creation"
            echo "### ⏭️ GitHub Release: already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "📦 Release v$NEW_VERSION does not exist — will create"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.already_exists == 'false'
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --generate-notes
          echo "### ✅ Created GitHub Release v$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
